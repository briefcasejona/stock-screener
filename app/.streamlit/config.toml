[server]
fileWatcherType = "none"
runOnSave = false
maxUploadSize = 300
# Only answer when the browser addresses this computer by name: a web page elsewhere that tries to reach the
# program through a trick address ("DNS rebinding") is refused.
allowedHosts = ["127.0.0.1", "localhost"]
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Apple-style look: the system font (San Francisco on a Mac, Segoe UI on Windows), Apple's greys and blue,
# soft rounded corners and pill buttons. Light and dark follow the computer's own setting.
[theme]
font = "-apple-system, BlinkMacSystemFont, Segoe UI Variable Text, Segoe UI, system-ui, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, Segoe UI Variable Display, Segoe UI, system-ui, sans-serif"
codeFont = "ui-monospace, SF Mono, Cascadia Mono, Consolas, monospace"
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["2.75rem", "1.625rem", "1.25rem", "1.0625rem", "1rem", "0.875rem"]
baseRadius = "0.75rem"
buttonRadius = "0.625rem"
showWidgetBorder = false
showSidebarBorder = false

[theme.light]
primaryColor = "#0071e3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
linkColor = "#0066cc"
borderColor = "#e5e5ea"
dataframeBorderColor = "#ececf0"
dataframeHeaderBackgroundColor = "#f5f5f7"
greenTextColor = "#248a3d"
redTextColor = "#d70015"

[theme.light.sidebar]
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#0a84ff"
backgroundColor = "#161617"
secondaryBackgroundColor = "#2c2c2e"
textColor = "#f5f5f7"
linkColor = "#2997ff"
borderColor = "#38383a"
dataframeBorderColor = "#2c2c2e"
dataframeHeaderBackgroundColor = "#1c1c1e"
greenTextColor = "#30d158"
redTextColor = "#ff453a"

[theme.dark.sidebar]
backgroundColor = "#1c1c1e"
secondaryBackgroundColor = "#2c2c2e"
